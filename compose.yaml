services:
  postgres:
    image: postgres:16-alpine
    container_name: myarchive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myarchive_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - myarchive-postgres-data:/var/lib/postgresql/data

volumes:
  myarchive-postgres-data:
